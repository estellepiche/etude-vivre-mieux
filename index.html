<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vivre mieux pour durer longtemps</title>
<style>
:root{--bg:#f5f2ec;--card:#ffffff;--ink:#21302a;--muted:#66706a;--line:#e1dbd0;--accent:#2f5d50;--accent-ink:#ffffff;--soft:#e7efea;--err:#a3402e;--t1:#c98b74;--t2:#dcb9a3;--t3:#a9c8b8;--t4:#5f9a83;--sand:#efe6d6}
@media (prefers-color-scheme:dark){:root{--bg:#161b19;--card:#1f2623;--ink:#ecebe6;--muted:#a3aba6;--line:#33403a;--accent:#7fb3a2;--accent-ink:#10201a;--soft:#25352f;--err:#e58a76;--t1:#b9765f;--t2:#8f7262;--t3:#5f8574;--t4:#7fb3a2;--sand:#2b2a24}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#bar{position:sticky;top:0;height:4px;background:var(--line);z-index:5}
#bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
main{max-width:640px;margin:0 auto;padding:28px 16px 40px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.qnum{display:inline-block;background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 7px;margin-right:8px;letter-spacing:0;font-weight:700}
h1{font-size:24px;line-height:1.3;margin:0 0 12px;font-weight:650}
h2{font-size:20px;line-height:1.35;margin:0 0 8px;font-weight:600}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
p{margin:0 0 14px}
a{color:var(--accent)}
.small{font-size:12.5px;color:var(--muted);margin-top:22px}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.grp{font-size:12.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.opts .grp:first-child,.pillset .grp:first-child{border-top:0;padding-top:0;margin-top:4px}
.grpbadge{display:inline-block;background:var(--soft);color:var(--accent);font-weight:650;font-size:15px;padding:7px 14px;border-radius:999px;margin:0 0 12px}
button.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
button.opt .box{flex:0 0 18px;height:18px;margin-top:2px;border:1.5px solid var(--muted);border-radius:50%}
button.opt.multi .box{border-radius:4px}
button.opt.sel{border-color:var(--accent);background:var(--soft)}
button.opt.sel .box{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--soft)}
button.opt.off{opacity:.45}
button.opt.rank .num{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
button.opt.rank.sel .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rankhint{font-size:13px;color:var(--muted);margin:10px 0 0}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:130px;resize:vertical}
.other{margin:-2px 0 4px 28px}
.scale{display:grid;gap:6px;margin:10px 0 4px}
.scale button{padding:13px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;min-width:0}
.scale button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.anch{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:12px}
.anch span:last-child{text-align:right}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.slider{margin:8px 0 4px}
.sl-ends{display:flex;justify-content:space-between;gap:16px;font-size:14.5px;line-height:1.35;margin-bottom:14px}
.sl-ends span{flex:1}.sl-ends span:last-child{text-align:right}
.sl-track{position:relative;display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.sl-track:before{content:"";position:absolute;left:14px;right:14px;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--line)}
.sl-dot{position:relative;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);background:#fff;padding:0;cursor:pointer}
.sl-dot.sel{background:var(--accent);box-shadow:0 0 0 5px var(--soft)}
.recap{background:var(--soft);border-color:var(--soft);font-size:15px}
.recap p{margin:0 0 8px}.recap ul{margin:0;padding-left:20px}
.lbl{font-weight:550;margin-bottom:6px}
.letter{background:var(--sand);border-radius:14px;padding:18px 18px 6px;margin:4px 0 18px;font-size:15.5px}
.letter .sign{font-style:italic;text-align:right}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15px;cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;flex:0 0 18px;accent-color:var(--accent)}
.check.miss span{color:var(--err)}
.field{margin:12px 0}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:24px}
.btn{padding:13px 22px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:10px 4px;text-decoration:none}
.later{display:block;margin:26px auto 0;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.err{color:var(--err);font-size:14px;font-weight:600;margin:4px 0 0;min-height:1px}
.miss-outline{outline:2px solid var(--err);outline-offset:4px;border-radius:12px}
/* pastilles */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
button.pill{min-height:42px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:14.5px;line-height:1.25;text-align:left;cursor:pointer}
button.pill.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.pill.none{margin-top:10px}
/* cartes une par une */
.cardtop{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}
.dots button.ok{background:var(--t3)}
.dots button.cur{background:var(--accent);transform:scale(1.25)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px 18px;box-shadow:0 6px 24px rgba(33,48,42,.06)}
.card.anim{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.cardlbl{font-size:19px;line-height:1.35;font-weight:620;margin:0 0 18px}
.tones{display:flex;flex-direction:column;gap:8px}
.tones button{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.tones button .sw{flex:0 0 14px;height:14px;border-radius:50%}
.tones button.sel{border-width:2px;border-color:var(--accent);background:var(--soft);font-weight:600}
.tones .emo{font-size:22px;line-height:1}
.cardnav{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
/* pauses */
.pause{text-align:center;padding-top:24px}
.pause svg{width:100%;max-width:300px;height:auto;margin:0 auto 22px;display:block}
.pause .step{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pause h1{margin-bottom:10px}
.pause .nav{justify-content:center}
/* dictée */
.dict{display:flex;align-items:center;gap:10px;margin:10px 0 0;flex-wrap:wrap}
.mic{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--accent);background:var(--card);color:var(--accent);font:inherit;font-size:14.5px;cursor:pointer}
.mic.on{background:var(--accent);color:var(--accent-ink)}
.mic.on .dotrec{background:var(--accent-ink);animation:pulse 1s infinite}
.dotrec{width:9px;height:9px;border-radius:50%;background:var(--err)}
@keyframes pulse{50%{opacity:.3}}
.tip{font-size:13px;color:var(--muted)}
/* fin, partage */
.share{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:22px}
.share textarea{min-height:120px;font-size:15px}
.sharebtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sharebtns a,.sharebtns button{flex:1 1 140px;text-align:center;text-decoration:none;padding:12px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;border:0}
.wa{background:#1f8f55;color:#fff}
.mail{background:var(--accent);color:var(--accent-ink)}
.copy{background:var(--soft);color:var(--ink)}
.legal h2{font-size:17px;margin-top:20px}
.legal p,.legal li{font-size:15px}
@media (max-width:380px){main{padding:22px 14px 32px}h2{font-size:19px}.cardlbl{font-size:18px}}
strong{font-weight:650}
</style>
</head>

var LAST_TICK = Date.now();
function tick(){ var n = Date.now(); META.actif_ms = (META.actif_ms || 0) + Math.min(n - LAST_TICK, 300000); LAST_TICK = n; }
function activeMin(){ return Math.max(1, ((META.actif_ms || 0) + Math.min(Date.now() - LAST_TICK, 300000)) / 60000); }
function nb(x){ return Math.round(x).toLocaleString(lang === "en" ? "en-GB" : (lang === "es" ? "es-ES" : "fr-FR")); }
function cellsText(min){
  var n = 3.8e6 * 60 * min; // ~330 milliards de cellules renouvelées par jour
  if (n >= 1e9) {
    var b = Math.round(n / 1e8) / 10;
    if (lang === "es") return nb(b * 1000) + " millones";
    if (lang === "en") return String(b).replace(/\.0$/, "") + " billion";

function pauseBody(b){
  var m = activeMin();

    .replace("{hair}", nb(Math.max(1, m * 0.33 / 1440 * 1000)))

function shuffled(key, list){
  if (!ORDER[key]) {
    var codes = list.map(function(o){ return o.c; });
    for (var i = codes.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = codes[i]; codes[i] = codes[j]; codes[j] = t; }
    ORDER[key] = codes;
  }
  var byC = {}; list.forEach(function(o){ byC[o.c] = o; });
  return ORDER[key].filter(function(c){ return byC[c]; }).map(function(c){ return byC[c]; })
    .concat(list.filter(function(o){ return ORDER[key].indexOf(o.c) < 0; }));
}

  return top.concat(shuffled(key, mid)).concat(fix);
}

  if (st.type === "single" || st.type === "scale") {
    if (S[st.v] == null || S[st.v] === "") { markMissing(["opts"]); return UI.req; }
    if (st.extra && S[st.v] === st.extra.when) { var r2 = checkFields(st.extra.fields); if (r2 && r2.item) markMissing([r2.item]); return r2 ? r2.e : null; }
    return null;
  }
  if (st.type === "multi") {
    var okm = arr(S[st.v]).length > 0; markMissing(okm ? [] : ["opts"]);
    if (!okm) return UI.req;
    if (st.extra && st.extra.whenAny && arr(S[st.v]).some(function(c){ return c !== "non"; })) { var r3 = checkFields(st.extra.fields); if (r3 && r3.item) markMissing([r3.item]); return r3 ? r3.e : null; }
    return null;
  }
  if (st.type === "chips") {
    var okc = arr(S[st.v]).length > 0 || (st.allowOther && st.otherField && (S[st.otherField.v] || "").trim());
    markMissing(okc ? [] : ["chips"]);
    return okc ? null : L("Merci de toucher au moins une réponse, ou « Aucun ».","Por favor, toca al menos una respuesta, o «Ninguno».","Please tap at least one answer, or “None”.");
  }
  if (st.type === "rank") {
    var ok = arr(S[st.v]).length >= st.max;
    markMissing(ok ? [] : ["rank"]);
    return ok ? null : (st.max < st.opts.length ? L("Merci de choisir tes 3 réponses les plus importantes.","Por favor, elige tus 3 respuestas más importantes.","Please choose your 3 most important answers.") : L("Merci de classer toutes les réponses.","Por favor, clasifica todas las respuestas.","Please rank all the answers."));
  }
  if (st.type === "gridScale" || st.type === "gridChecks") {
    var items = itemsOf(st);
    for (var i = 0; i < items.length; i++) if (!answered(st, items[i])) { CARD[st.key] = i; return UI.reqCards; }
    return null;
  }
  return null;
}
function markMissing(codes){
  document.querySelectorAll("[data-item]").forEach(function(c){ c.classList.toggle("miss-outline", codes.indexOf(c.dataset.item) >= 0); c.classList.toggle("miss", codes.indexOf(c.dataset.item) >= 0); });
}

function goNext(){
  var st = stepByKey(cur);
  var e = validate(st);
  if (e) {
    if (st.type === "gridScale" || st.type === "gridChecks") render();
    var er = document.getElementById("err"); er.textContent = tx(e);
    var target = document.querySelector(".miss") || document.getElementById("err");
    if (target && target.scrollIntoView) target.scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }
  tick();
  if (st.last) return submit();
  var steps = visible();
  var idx = steps.map(function(x){ return x.key; }).indexOf(cur);
  hist.push(cur);
  cur = steps[idx + 1].key;
  save(false);
  render(); window.scrollTo(0, 0);
}
var AUTO_T = null;
function autoNext(key){
  clearTimeout(AUTO_T);
  AUTO_T = setTimeout(function(){ if (cur === key && !VIEW && !done) goNext(); }, 320);
}
function goBack(){
  var st = stepByKey(cur);
  if (st && (st.type === "gridScale" || st.type === "gridChecks") && cardIdx(st) > 0) { CARD[st.key] = cardIdx(st) - 1; render(); return; }
  var keys = visible().map(function(x){ return x.key; });
  while (hist.length) { var k = hist.pop(); if (keys.indexOf(k) >= 0) { cur = k; break; } }
  render(); window.scrollTo(0, 0);
}

function exportRow(final){
  var steps = buildSteps();
  var row = {id_reponse:META.id_reponse, debut:META.debut, fin:final ? new Date().toISOString() : "",
    duree_minutes:Math.round((Date.now() - Date.parse(META.debut)) / 6000) / 10, complet:final ? "oui" : "non",

  function put(k, v){ if (v == null || v === "") return; row[k] = Array.isArray(v) ? v.join(";") : v; }
  var all30 = [], all31 = [];
  steps.forEach(function(st){
    if (st.type === "auto") { put(st.v, st.value); return; }
    if (!st.v) return;
    if (st.type === "single" || st.type === "scale") {
      put(st.v, S[st.v]);
      var o = st.opts && labelOf(st.opts, S[st.v]);
      if (o && o.o) put(st.v + "__autre", S[st.v + "__autre"]);
    } else if (st.type === "multi" || st.type === "chips") {
      var val = arr(S[st.v] === undefined && st.preset ? st.preset : S[st.v]).filter(function(c){ return labelOf(st.opts, c); });
      put(st.v, val);
      st.opts.forEach(function(o2){ if (o2.o && val.indexOf(o2.c) >= 0) put(otherKey(st, o2), S[otherKey(st, o2)]); });
      if (st.otherField) put(st.otherField.v, (S[st.otherField.v] || "").trim());
      if (st.v.indexOf("q34_utilises__") === 0) all30 = all30.concat(val.filter(function(c){ return c !== "aucun"; }));
      if (st.v.indexOf("q35_envie_essayer__") === 0) all31 = all31.concat(val.filter(function(c){ return c !== "aucun"; }));
    } else if (st.type === "gridScale" || st.type === "gridChecks") {
      itemsOf(st).forEach(function(it){ put(st.v + "__" + it.c, S[st.v + "__" + it.c]); });
    } else if (st.type === "rank") {
      put(st.v, arr(S[st.v]));
    } else if (st.type === "text") {
      put(st.v, (S[st.v] || "").trim());
      if (st.check) put(st.check.v, S[st.check.v]);

  return row;
}

function restore(o){
  if (!o || !o.S) return false;
  LAST_TICK = Date.now();
  S = o.S; ORDER = o.ORDER || {}; CARD = o.CARD || {}; hist = o.hist || []; cur = o.cur || "q00"; META = o.META || META; lang = o.lang || S.q00_langue || "fr";
  return true;
}
function keepLocal(){ try { if (done) localStorage.removeItem(STORE); else localStorage.setItem(STORE, JSON.stringify(snapshot(true))); } catch (e) {} }
function save(final, ok, fail){
  keepLocal();
  var payload = {action:"enregistrer", columns:allColumns(), row:exportRow(final), contactColumns:CONTACT_COLUMNS, contact:final ? exportContact() : null};
  api(payload, function(e, res){ if (!e && res && res.ok) { if (ok) ok(); } else if (fail) fail(); });
}
function submit(){
  var btn = document.getElementById("nextBtn"); btn.disabled = true; btn.textContent = tx(UI.sending);
  document.getElementById("err").textContent = "";
  save(true, function(){ done = true; keepLocal(); render(); window.scrollTo(0, 0); }, function(){
    btn.disabled = false; btn.textContent = tx(UI.submit); document.getElementById("err").textContent = tx(UI.sendErr);
  });
}

/* ---------- fin et partage ---------- */
function studyUrl(){ return (GAS ? GAS.url : location.origin + location.pathname) + "?canal=partage"; }
function restartFresh(){
  try { localStorage.removeItem(STORE); } catch (e) {}
  S = {}; ORDER = {}; CARD = {}; hist = []; cur = "q00"; done = false; VIEW = null;
  META = {id_reponse: uuid(), debut: new Date().toISOString(), canal: (PARAMS.canal || "").slice(0, 60), langue_lien: (PARAMS.langue || "").slice(0, 5)};
  LAST_TICK = Date.now(); render(); window.scrollTo(0, 0);
}
function renderEnd(){
  document.querySelector("#bar>div").style.width = "100%";
  app.appendChild(el("h1", null, tx(L("Merci !","¡Gracias!","Thank you!"))));
  app.appendChild(el("p", null, tx(L("Merci beaucoup pour ton temps et ta sincérité. Si tu as laissé ton e-mail, tu recevras la synthèse de l'étude dès qu'elle sera prête.",
    "Muchas gracias por tu tiempo y tu sinceridad. Si has dejado tu correo, recibirás la síntesis del estudio en cuanto esté lista.",
    "Thank you very much for your time and honesty. If you left your email, you'll receive the summary of the study as soon as it's ready."))));
  var box = el("div", "share");
  box.appendChild(el("h2", null, tx(L("Tu veux m'aider à aller plus loin ?","¿Quieres ayudarme a llegar más lejos?","Want to help me go further?"))));
  box.appendChild(el("p", "sub", tx(L("Plus il y aura de réponses, plus l'étude sera utile. Tu peux la transmettre à ton réseau : le message ci-dessous est modifiable.","Cuantas más respuestas, más útil será el estudio. Puedes compartirlo con tu red: el mensaje de abajo se puede modificar.","The more answers, the more useful the study. You can pass it on to your network: the message below can be edited."))));
  var ta = el("textarea"); ta.id = "shareText";
  ta.value = tx(L("Je t'encourage à répondre à cette étude d'une amie, que je viens moi-même de faire, sur un sujet que tu trouveras sans aucun doute intéressant : comment vivre mieux, plus longtemps. Cela prend environ 20 minutes et c'est anonyme.",
    "Te animo a responder a este estudio de una amiga, que yo mism{o|a} acabo de hacer, sobre un tema que sin duda te parecerá interesante: cómo vivir mejor durante más tiempo. Lleva unos 20 minutos y es anónimo.",
    "I'd encourage you to answer this study by a friend of mine, which I've just completed myself, on a topic I'm sure you'll find interesting: how to live better, for longer. It takes about 20 minutes and it's anonymous.")) + "\n" + studyUrl();
  box.appendChild(ta);
  var btns = el("div", "sharebtns");
  var wa = el("a", "wa", "WhatsApp"); wa.target = "_blank"; wa.rel = "noopener"; wa.dataset.act = "wa";
  var ml = el("a", "mail", tx(L("E-mail","Correo","Email"))); ml.dataset.act = "mail"; ml.target = "_top";
  function refresh(){
    wa.href = "https://wa.me/?text=" + encodeURIComponent(ta.value);
    ml.href = "mailto:?subject=" + encodeURIComponent(tx(L("Une étude qui devrait t'intéresser","Un estudio que te puede interesar","A study you might find interesting"))) + "&body=" + encodeURIComponent(ta.value);
  }
  ta.oninput = refresh; refresh();
  var cp = el("button", "copy", tx(L("Copier","Copiar","Copy"))); cp.type = "button";
  cp.onclick = function(){
    var done2 = function(){ cp.textContent = tx(L("Copié !","¡Copiado!","Copied!")); };
    if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done2, function(){ ta.select(); document.execCommand("copy"); done2(); });
    else { ta.select(); document.execCommand("copy"); done2(); }
  };
  btns.appendChild(wa); btns.appendChild(ml); btns.appendChild(cp);
  box.appendChild(btns);
  app.appendChild(box);
}

/* ---------- démarrage ---------- */
(function init(){
  var l = (PARAMS.langue || "").toLowerCase();
  if (["fr","es","en"].indexOf(l) < 0) { l = (navigator.language || "").slice(0, 2).toLowerCase(); }
  if (["fr","es","en"].indexOf(l) >= 0) { lang = l; S.q00_langue = l; }
  if (PARAMS.reprise) {
    VIEW = "chargement"; render();
    var clean = function(){ if (GAS) return; try { history.replaceState(null, "", location.pathname + (PARAMS.canal ? "?canal=" + encodeURIComponent(PARAMS.canal) : "")); } catch (e) {} };
    var fail = function(){ clean(); VIEW = "lien_invalide"; render(); };
    var ok = function(j){ clean(); if (j && j.ok && restore(JSON.parse(j.etat))) { VIEW = null; keepLocal(); render(); } else fail(); };
    var run = gasRun();
    if (run) { run.withSuccessHandler(ok).withFailureHandler(fail).apiReprise(String(PARAMS.reprise)); return; }
    if (!API_URL) return fail();
    fetch(API_URL + "?action=reprise&token=" + encodeURIComponent(PARAMS.reprise))
      .then(function(r){ return r.json(); })
      .then(function(j){ clean(); if (j && j.ok && restore(JSON.parse(j.etat))) { VIEW = null; keepLocal(); render(); } else fail(); })
      .catch(fail);
    return;
  }
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved && saved.cur && saved.cur !== "q00" && saved.cur !== "accueil" && restore(saved)) VIEW = "retour";
  } catch (e) {}
  render();
})();
</script>
